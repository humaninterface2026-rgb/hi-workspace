<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Workspace</title>
<style>
:root{--bg:#F1F4F2;--surface:#FFFFFF;--ink:#17221E;--muted:#56655F;--line:#D2DBD6;--accent:#0D6B5D;--crit:#A3302A;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F1614;--surface:#16201D;--ink:#E3EBE7;--muted:#9AABA4;--line:#2B3A35;--accent:#55BBA8;--crit:#E2716A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
main{max-width:400px;margin:14vh auto 0;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1{font-size:24px;margin:0}
form{display:grid;gap:10px}
input[type=password]{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
label,.hint{font-size:13px;color:var(--muted)}
button{justify-self:start;font:inherit;padding:8px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--crit);font-size:13px;min-height:1.4em}
</style></head><body>
<main id="m" hidden>
  <h1>請輸入密碼</h1>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" aria-label="密碼" placeholder="密碼">
    <label><input type="checkbox" id="rm"> 在這台裝置記住（共用電腦請勿勾）</label>
    <button type="submit">進入</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="hint" id="hint" hidden></p>
</main>
<noscript>需要開啟 JavaScript。</noscript>
<script>
(() => {
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fresh = p => fetch(p + "?t=" + Date.now(), {cache: "no-store"}).then(r => { if (!r.ok) throw new Error("net " + p + " " + r.status); return r.json(); });
const isCrypto = e => e && ["OperationError", "DataError", "InvalidAccessError"].includes(e.name);
try { localStorage.removeItem("k1"); } catch (e) {}   // older builds kept the raw key here

// "remember": a non-extractable private key in IndexedDB; scripts can use it but never read it out
const DB = "ws", ST = "k";
function idb(){ return new Promise((ok, no) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function kv(mode, fn){ const db = await idb(); return new Promise((ok, no) => { const t = db.transaction(ST, mode); const req = fn(t.objectStore(ST)); t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); }); }
const keyGet = () => kv("readonly", s => s.get("p")).catch(() => null);
const keyPut = k => kv("readwrite", s => s.put(k, "p")).catch(() => null);
const keyDel = () => kv("readwrite", s => s.delete("p")).catch(() => null);

async function unwrap(pass){
  const k = await fresh("key.json");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(k.salt), iterations:k.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pkcs8 = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(k.iv)}, kek, b64(k.ct));
  return crypto.subtle.importKey("pkcs8", pkcs8, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
}
async function open(priv){
  const d = await fresh("data.json");
  const key = await crypto.subtle.importKey("raw", await crypto.subtle.decrypt({name:"RSA-OAEP"}, priv, b64(d.ek)), {name:"AES-CBC"}, false, ["decrypt"]);
  let pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:b64(d.iv)}, key, b64(d.ct));
  if (d.gz) pt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new TextDecoder().decode(pt);
}
const CSP = document.querySelector('meta[http-equiv="Content-Security-Policy"]').outerHTML;
function show(html){
  html = html.replace(/<title>[\s\S]*?<\/title>/i, "<title>Workspace</title>")
             .replace(/<head[^>]*>/i, h => h + CSP + '<meta name="radar-store" content="session">');
  document.open(); document.write(html); document.close();
}
const NET = "連線或讀取失敗，請稍後重新整理。";

async function start(){
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    $("m").hidden = false; $("err").textContent = "這個瀏覽器太舊，請改用新版 Chrome、Edge 或 Safari。"; return;
  }
  // the form works on every path that shows it
  $("f").onsubmit = async ev => {
    ev.preventDefault(); $("err").textContent = "解密中…";
    let priv;
    try { priv = await unwrap($("pw").value); }
    catch (e) { $("err").textContent = isCrypto(e) ? "密碼不對。" : NET; return; }
    try {
      const html = await open(priv);
      if ($("rm").checked) await keyPut(priv); else await keyDel();
      show(html);
    } catch (e) { $("err").textContent = isCrypto(e) ? "內容暫時無法解開（可能正在更新），請稍後重新整理。" : NET; }
  };
  if (/[?&]forget\b/.test(location.search)) {
    await keyDel(); history.replaceState(null, "", location.pathname);
    $("hint").hidden = false; $("hint").textContent = "已清除這台裝置記住的密碼。";
  } else {
    const saved = await keyGet();
    if (saved) {
      try { show(await open(saved)); return; }
      catch (e) {
        if (isCrypto(e)) { await keyDel(); $("err").textContent = "請重新輸入密碼。"; }
        else $("err").textContent = NET;
      }
    }
  }
  $("m").hidden = false; $("pw").focus();
}
start();
})();
</script>
</body></html>
